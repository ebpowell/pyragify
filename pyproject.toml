[project]
name = "pyragify"
version = "0.2.0"
description = "A tool for processing code repositories, files, and tables, into semantic chunks for analysis with LLMs, especiallyNotebookLM."
readme = "README.md"
requires-python = ">=3.10, <3.13"
authors = [
    {name = "ThomasBury"},
    {name = "ebpowell"}
]
license = {text = "The Unlicense"}
keywords = ["code-processing", "chunking", "repository-analysis", "notebookLM"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = [
    "omegaconf>=2.3.0",
    "pathspec>=0.12.1",
    "pyyaml>=6.0.2",
    "typer>=0.15.1",
    "sqlparse>=0.5.0",
    "sentence-transformers>=2.2.0",
    "openpyxl>=3.1.5",
    "transformers>=4.38.0",
    "triton"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0"
]

[project.urls]
homepage = "https://github.com/ebpowell/pyragify"
repository = "https://github.com/ebpowell/pyragify"

[project.scripts]
pyragify = "pyragify.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src", "src/pyragify"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
